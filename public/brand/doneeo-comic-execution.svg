    <line x1="30" y1="89" x2="30" y2="120" stroke="#00a68f" stroke-width="3"/>
    <rect x="46" y="72" width="76" height="16" rx="6" fill="#e5f8f4"/>

    <circle cx="30" cy="130" r="9" fill="#ff6b5d"/>
    <line x1="30" y1="139" x2="30" y2="170" stroke="#dfe6ea" stroke-width="3"/>
    <rect x="46" y="122" width="76" height="16" rx="6" fill="#e5f8f4"/>

