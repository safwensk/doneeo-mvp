<svg viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A prepared executor checking tools, supplies and safety equipment">
  <path d="M60 380c0-160 100-280 260-290 150-9 260 90 270 240 10 150-90 280-250 320-170 42-280-70-280-270z" fill="#e5f8f4"/>
  <ellipse cx="320" cy="640" rx="220" ry="26" fill="#07163d" opacity="0.06"/>

  <!-- legs first (behind torso hem) -->
  <rect x="266" y="470" width="34" height="100" rx="14" fill="#07163d"/>
  <rect x="330" y="470" width="34" height="100" rx="14" fill="#07163d"/>
  <rect x="258" y="556" width="52" height="22" rx="10" fill="#ff6b5d"/>
  <rect x="322" y="556" width="52" height="22" rx="10" fill="#ff6b5d"/>

  <!-- torso -->
  <path d="M232 320c0-30 30-52 68-52s68 22 68 52v170h-136z" fill="#00a68f"/>
  <rect x="270" y="330" width="60" height="90" rx="10" fill="#e5f8f4" opacity="0.5"/>

  <!-- helmet under arm -->
  <path d="M200 400a34 34 0 0 1 68 0z" fill="#f4b942"/>
  <rect x="196" y="398" width="76" height="10" rx="5" fill="#f4b942"/>

  <!-- arm holding clipboard -->
  <path d="M368 330c26 6 40 24 40 50v40" stroke="#00a68f" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- head -->
  <circle cx="300" cy="244" r="42" fill="#07163d"/>
  <circle cx="300" cy="262" r="42" fill="#ffd9b8"/>
  <circle cx="285" cy="264" r="4" fill="#07163d"/>
  <circle cx="315" cy="264" r="4" fill="#07163d"/>
  <path d="M286 278c5 6 22 6 27 0" stroke="#07163d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- clipboard with checkmark -->
  <g transform="translate(388,330)">
    <rect width="90" height="112" rx="10" fill="#ffffff" stroke="#dfe6ea" stroke-width="2"/>
    <rect x="24" y="-10" width="42" height="18" rx="6" fill="#07163d"/>
    <line x1="16" y1="34" x2="74" y2="34" stroke="#dfe6ea" stroke-width="4"/>
    <line x1="16" y1="54" x2="74" y2="54" stroke="#dfe6ea" stroke-width="4"/>
    <circle cx="45" cy="86" r="22" fill="#00a68f"/>
    <path d="M35 86l7 7 15-15" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tools laid on ground -->
  <g transform="translate(90,470)">
    <path d="M0 170L26 0M60 170L34 0" stroke="#647083" stroke-width="8" fill="none" stroke-linecap="round"/>
    <line x1="6" y1="140" x2="54" y2="140" stroke="#647083" stroke-width="7"/>
    <line x1="9" y1="100" x2="51" y2="100" stroke="#647083" stroke-width="7"/>
    <line x1="12" y1="60" x2="48" y2="60" stroke="#647083" stroke-width="7"/>
    <line x1="15" y1="20" x2="45" y2="20" stroke="#647083" stroke-width="7"/>
  </g>

  <g transform="translate(430,560)">
    <rect x="0" y="20" width="110" height="60" rx="10" fill="#ff6b5d"/>
    <rect x="30" y="0" width="50" height="24" rx="8" fill="none" stroke="#ff6b5d" stroke-width="8"/>
    <rect x="0" y="46" width="110" height="10" fill="#07163d" opacity="0.15"/>
  </g>

  <g transform="translate(190,610)">
    <path d="M0 0v-90h14" stroke="#07163d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="10" y="-60" width="60" height="60" fill="none" stroke="#07163d" stroke-width="6" rx="4"/>
    <circle cx="10" cy="14" r="16" fill="#07163d"/>
    <circle cx="10" cy="14" r="6" fill="#e5f8f4"/>
  </g>
</svg>
