spring.application.name=doneeo-api
server.port=8080
server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
spring.datasource.url=jdbc:sqlite:${DONEEO_DATA_DIR:../.local-run}/customers.sqlite?foreign_keys=on&busy_timeout=180000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
doneeo.planner.url=http://127.0.0.1:5174
server.error.include-message=never
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
